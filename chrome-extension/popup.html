<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Prompt Mirror</title>
  <link rel="stylesheet" href="style.css">
  <script src="libs/chart.umd.js"></script>
</head>
<body>
  <header>
    <h1><span>🔮</span> Prompt Mirror</h1>
    <div class="actions">
      <button id="theme-btn" title="Toggle Theme">🌙</button>
      <button id="lang-btn" title="Switch Language" style="font-size: 10px; font-weight: bold; width: auto; padding: 4px 8px;">EN</button>
      <button id="main-site-btn" title="Open Main Site">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
      </button>
      <button id="scan-btn" title="Scan Current Page">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
          <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
          <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
          <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
          <rect x="7" y="7" width="10" height="10" rx="1"></rect>
        </svg>
      </button>
      <button id="export-btn" title="Export Data">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <!-- Dashboard View -->
    <div id="dashboard-view">
      <!-- KPI Cards -->
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-label">Today</div>
          <div class="kpi-value" id="today-count">0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Total Prompts</div>
          <div class="kpi-value" id="total-count">0</div>
        </div>
      </div>

      <!-- Charts Tabs -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="radar">Skill Radar</button>
        <button class="tab-btn" data-tab="pie">Type Dist.</button>
      </div>

      <!-- Chart Canvas -->
      <div class="chart-container">
        <canvas id="mainChart"></canvas>
      </div>

      <!-- Recent List -->
      <div class="list-header">
        <h2>Recent</h2>
        <span style="font-size:11px;color:rgba(255,255,255,0.5)" id="last-sync">Just now</span>
      </div>
      <div class="prompt-list" id="recent-list">
        <!-- Items will be injected here -->
      </div>

      <!-- Privacy & Data Controls -->
      <div class="privacy-footer">
        <a href="#" id="privacy-link" style="color: rgba(255,255,255,0.4); font-size: 11px; text-decoration: none;">Privacy Policy</a>
        <div style="display: flex; gap: 6px; align-items: center;">
          <button id="sync-btn" style="font-size: 11px; display: none;">Sync to Cloud</button>
          <button id="login-btn" style="font-size: 11px;">Login</button>
          <button id="manage-btn">Manage Data</button>
        </div>
      </div>
    </div>

    <!-- Manage View -->
    <div id="manage-view">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <button id="back-btn" style="padding:4px 8px; font-size:12px;">← Back</button>
        <h2 style="margin:0; font-size:14px; color:var(--text);">Data Manager</h2>
        <button id="clear-all-btn" style="color:#ff4757; font-size:11px;">Clear All</button>
      </div>
      <div id="manage-list" style="max-height: 450px; overflow-y: auto;">
        <!-- Manage Items injected here -->
      </div>
    </div>
  </main>

  <!-- Login Modal -->
  <div id="login-modal" class="modal-overlay" style="display:none;">
    <div class="login-panel">
      <button class="modal-close" id="modal-close-btn">✕</button>
      <div class="login-cloud-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M3 15a4 4 0 0 0 4 4h9a5 5 0 0 0 1.5-9.77A7 7 0 1 0 4.8 9.6"/>
        </svg>
      </div>
      <h2 class="login-title">Cloud Sync</h2>
      <p class="login-subtitle">Login to sync data across devices</p>
      <div class="login-buttons">
        <button id="github-login-btn" class="oauth-btn github-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
          </svg>
          GitHub
        </button>
        <button id="google-login-btn" class="oauth-btn google-btn">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Google
        </button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
